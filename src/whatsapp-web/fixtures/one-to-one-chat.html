  [role="application"] { padding: 12px 63px 8px; }
  ._amjw { display: flex; justify-content: center; margin: 12px 0; }
  ._amjw span { background: #fff; border-radius: 7.5px; padding: 5px 12px; font-size: 12.5px; text-transform: uppercase; color: #54656f; }
  .message-in, .message-out { display: flex; margin-bottom: 2px; }
